name: CI — LibroManager

on:
    push:
        branches:
            - develop
            - 'feature/**'
    pull_request:
        branches:
            - main
            - develop

jobs:
    ci:
        name: Lint + TypeScript + Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Install dependencies
              run: pnpm install

            - name: Generate Prisma client
              run: pnpm prisma generate

            - name: TypeScript check
              run: pnpm tsc --noEmit

            - name: ESLint
              run: pnpm lint

            - name: Security tests
              run: pnpm test

            - name: Build
              run: pnpm build
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
                  BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
